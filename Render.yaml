services:
  - type: web
    name: ai-shorts-generator
    runtime: python
    region: oregon          # change to: frankfurt, singapore, ohio, virginia
    plan: starter           # starter = $7/mo  |  standard = $25/mo (more RAM, faster render)

    # sudo is required for apt-get on Render's build environment
    buildCommand: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install -r requirements.txt

    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --worker-class uvicorn.workers.UvicornWorker --timeout 300

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"           # 3.14 is too new — use stable 3.11
      - key: OUTPUT_DIR
        value: /tmp/shorts-output
      - key: ALLOWED_ORIGINS
        value: https://ai-shorts-generator.onrender.com   # replace with your actual Render URL
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false

    healthCheckPath: /health
