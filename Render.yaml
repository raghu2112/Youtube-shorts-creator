services:
  - type: web
    name: ai-shorts-generator
    runtime: python
    region: oregon
    plan: starter

    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --worker-class uvicorn.workers.UvicornWorker --timeout 300 --log-level info

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: OUTPUT_DIR
        value: /tmp/shorts-output
      - key: ALLOWED_ORIGINS
        value: https://ai-shorts-generator.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false

    healthCheckPath: /health
